name: Source checks
on:
  push:
  pull_request:
jobs:
  static-source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression checks
        shell: bash
        run: |
          python tests/test_structure.py
          python tests/test_architecture_build.py
          python tests/test_inno_preprocessor.py
          python tests/test_maintenance_patch.py
          python tools/check_source_release.py
